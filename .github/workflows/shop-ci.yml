name: Week 3 Shop CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shops/yasaman/package-lock.json
      - name: Install dependencies
        working-directory: shops/yasaman
        run: npm ci
      - name: Check TypeScript
        working-directory: shops/yasaman
        run: npm run check
      - name: Build the shop
        working-directory: shops/yasaman
        run: npm run build
      - name: Check week 3 page rules
        run: python3 shops/yasaman/check_ci.py
      - name: Download validator
        run: curl --fail --location --retry 3 https://github.com/validator/validator/releases/download/latest/vnu.jar --output "$RUNNER_TEMP/vnu.jar"
      - name: Validate HTML
        run: java -jar "$RUNNER_TEMP/vnu.jar" --errors-only shops/yasaman/index.html
      - name: Validate CSS
        run: java -jar "$RUNNER_TEMP/vnu.jar" --errors-only --css shops/yasaman/style.css
